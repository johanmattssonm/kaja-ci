[package]
name = "kaja-ci"
version = "0.2.0"
edition = "2024"

[lib]
path = "frontend/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
kaja-web = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-wasm = { version = "0.2", features = ["serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo = "0.12"
gloo-net = { version = "0.7", features = ["websocket"] }
console_error_panic_hook = "0.1.7"
futures-util = "0.3"
futures-channel = "0.3"
serde-wasm-bindgen = "0.6"
inventory = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Navigator",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "NodeList",
    "CustomElementRegistry",
    "ElementDefinitionOptions",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
