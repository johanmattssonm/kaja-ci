[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
gloo = "0.12.0"
gloo-net = { version = "0.7", features = ["websocket"] }
inventory = "0.3.25"
js-sys = "0.3.107"
kaja-callback-macro = "1.0.2"
kaja-html-macro = "1.0.5"
kaja-web = "1.0.7"
kaja-web-component = "1.0.2"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "EventTarget", "HtmlInputElement", "KeyboardEvent"] }
futures-util = "0.3"
futures-channel = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
